            imagePullPolicy: IfNotPresent
            command:
            - bash
            - -c
            - set -euo pipefail; TS=$(date +%Y%m%d-%H%M%S); mkdir -p /backups/cron; echo "== backup mongodb $TS"; mongodump --host=mongo1:27017 --oplog --gzip --archive=/backups/cron/$TS.archive.gz && ls -la /backups/cron/$TS.archive.gz; echo "== done"; ls -1dt /backups/cron/* 2>/dev/null | tail -n +$((KEEP+1)) | xargs -r rm -rf; echo "kept:"; ls -la /backups/cron
