  namespace: nslab-mongodb
  labels:
    app.kubernetes.io/name: backup-mongodb
    app.kubernetes.io/part-of: nslab
    nslab.io/stack: mongodb
    nslab.io/addon: backup
spec:
  schedule: 0 */6 * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
