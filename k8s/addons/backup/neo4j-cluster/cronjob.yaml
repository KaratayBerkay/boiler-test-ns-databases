  labels:
    app.kubernetes.io/name: backup-neo4j-cluster
    app.kubernetes.io/part-of: nslab
    nslab.io/stack: neo4j-cluster
    nslab.io/addon: backup
spec:
  schedule: 0 */6 * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
