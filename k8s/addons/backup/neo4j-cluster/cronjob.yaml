          containers:
          - name: backup
            image: 10.10.2.51:8443/nslab/neo4j:5-enterprise
            imagePullPolicy: IfNotPresent
            command:
            - bash
            - -c
            - set -euo pipefail; TS=$(date +%Y%m%d-%H%M%S); mkdir -p /backups/cron; echo "== backup neo4j-cluster $TS"; mkdir -p /backups/cron/$TS && neo4j-admin database backup lab --from=neo4j1:6362 --to-path=/backups/cron/$TS --type=full && ls -la /backups/cron/$TS; echo "== done"; ls -1dt /backups/cron/* 2>/dev/null | tail -n +$((KEEP+1)) | xargs -r rm -rf; echo "kept:"; ls -la /backups/cron
