# generated by k8s/gen.py from stacks/neo4j-cluster/compose.yaml -- edit the compose file, then `make -C k8s gen`
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo4j1
  namespace: nslab-neo4j-cluster
  labels:
    app.kubernetes.io/name: neo4j1
    app.kubernetes.io/part-of: nslab
    nslab.io/stack: neo4j-cluster
    nslab.io/container: nslab-neo4j1
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: neo4j1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neo4j1
        app.kubernetes.io/part-of: nslab
        nslab.io/stack: neo4j-cluster
        nslab.io/container: nslab-neo4j1
    spec:
      hostname: neo4j1
      containers:
      - name: neo4j1
        image: 10.10.2.51:8443/nslab/neo4j:5-enterprise
        imagePullPolicy: IfNotPresent
        env:
        - name: NEO4J_ACCEPT_LICENSE_AGREEMENT
          value: eval
        - name: NEO4J_AUTH
          value: neo4j/labpass123
        - name: NEO4J_PLUGINS
          value: '["apoc"]'
        - name: NEO4J_db_logs_query_enabled
          value: INFO
        - name: NEO4J_db_logs_query_parameter__logging__enabled
          value: 'true'
        - name: NEO4J_db_logs_query_threshold
          value: 100ms
        - name: NEO4J_dbms_cluster_discovery_endpoints
          value: neo4j1:5000,neo4j2:5000,neo4j3:5000
        - name: NEO4J_dbms_databases_seed__from__uri__providers
          value: FileSeedProvider,URLConnectionSeedProvider,S3SeedProvider,CloudSeedProvider
        - name: NEO4J_dbms_security_procedures_unrestricted
          value: apoc.*
        - name: NEO4J_initial_dbms_default__primaries__count
          value: '3'
        - name: NEO4J_initial_dbms_default__secondaries__count
          value: '0'
        - name: NEO4J_initial_server_mode__constraint
          value: PRIMARY
        - name: NEO4J_server_backup_enabled
          value: 'true'
        - name: NEO4J_server_backup_listen__address
          value: 0.0.0.0:6362
        - name: NEO4J_server_bolt_advertised__address
          value: 127.0.0.1:31006
        - name: NEO4J_server_bolt_listen__address
          value: 0.0.0.0:7687
        - name: NEO4J_server_bolt_thread__pool__max__size
          value: '800'
        - name: NEO4J_server_cluster_advertised__address
          value: neo4j1:6000
        - name: NEO4J_server_cluster_listen__address
          value: 0.0.0.0:6000
        - name: NEO4J_server_cluster_raft_advertised__address
          value: neo4j1:7000
        - name: NEO4J_server_cluster_raft_listen__address
          value: 0.0.0.0:7000
        - name: NEO4J_server_cluster_system__database__mode
          value: PRIMARY
        - name: NEO4J_server_discovery_advertised__address
          value: neo4j1:5000
        - name: NEO4J_server_discovery_listen__address
          value: 0.0.0.0:5000
        - name: NEO4J_server_memory_heap_initial__size
          value: 2G
        - name: NEO4J_server_memory_heap_max__size
          value: 2G
        - name: NEO4J_server_memory_pagecache_size
          value: 1G
        ports:
        - containerPort: 7474
        - containerPort: 7687
        volumeMounts:
        - name: neo4j1
          mountPath: /data
        - name: neo4j1-logs
          mountPath: /logs
        - name: backups
          mountPath: /backups
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - cypher-shell -u neo4j -p labpass123 -d system 'SHOW DATABASE system YIELD currentStatus RETURN currentStatus' | grep -q online || exit 1
          periodSeconds: 5
          timeoutSeconds: 10
          failureThreshold: 3
        startupProbe:
          exec:
            command:
            - sh
            - -c
            - cypher-shell -u neo4j -p labpass123 -d system 'SHOW DATABASE system YIELD currentStatus RETURN currentStatus' | grep -q online || exit 1
          periodSeconds: 5
          timeoutSeconds: 10
          failureThreshold: 66
      terminationGracePeriodSeconds: 30
      enableServiceLinks: false
      volumes:
      - name: neo4j1
        persistentVolumeClaim:
          claimName: neo4j1
      - name: neo4j1-logs
        persistentVolumeClaim:
          claimName: neo4j1-logs
      - name: backups
        persistentVolumeClaim:
          claimName: backups
