# generated by k8s/gen.py from stacks/neo4j/compose.yaml -- edit the compose file, then `make -C k8s gen`
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo4j
  namespace: nslab-neo4j
  labels:
    app.kubernetes.io/name: neo4j
    app.kubernetes.io/part-of: nslab
    nslab.io/stack: neo4j
    nslab.io/container: nslab-neo4j
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: neo4j
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neo4j
        app.kubernetes.io/part-of: nslab
        nslab.io/stack: neo4j
        nslab.io/container: nslab-neo4j
    spec:
      hostname: neo4j
      containers:
      - name: neo4j
        image: 10.10.2.51:8443/nslab/neo4j:5-community
        imagePullPolicy: IfNotPresent
        env:
        - name: NEO4J_AUTH
          value: neo4j/labpass123
        - name: NEO4J_PLUGINS
          value: '["apoc"]'
        - name: NEO4J_db_logs_query_enabled
          value: INFO
        - name: NEO4J_db_logs_query_parameter__logging__enabled
          value: 'true'
        - name: NEO4J_db_logs_query_threshold
          value: 100ms
        - name: NEO4J_dbms_security_procedures_unrestricted
          value: apoc.*
        - name: NEO4J_server_bolt_thread__pool__max__size
          value: '800'
        - name: NEO4J_server_memory_heap_initial__size
          value: 4G
        - name: NEO4J_server_memory_heap_max__size
          value: 4G
        - name: NEO4J_server_memory_pagecache_size
          value: 2G
        ports:
        - containerPort: 7474
        - containerPort: 7687
        volumeMounts:
        - name: neo4j-data
          mountPath: /data
        - name: neo4j-logs
          mountPath: /logs
        - name: backups
          mountPath: /backups
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - cypher-shell -u neo4j -p labpass123 'RETURN 1' || exit 1
          periodSeconds: 5
          timeoutSeconds: 10
          failureThreshold: 3
        startupProbe:
          exec:
            command:
            - sh
            - -c
            - cypher-shell -u neo4j -p labpass123 'RETURN 1' || exit 1
          periodSeconds: 5
          timeoutSeconds: 10
          failureThreshold: 44
      terminationGracePeriodSeconds: 30
      enableServiceLinks: false
      volumes:
      - name: neo4j-data
        persistentVolumeClaim:
          claimName: neo4j-data
      - name: neo4j-logs
        persistentVolumeClaim:
          claimName: neo4j-logs
      - name: backups
        persistentVolumeClaim:
          claimName: backups
