apiVersion: apps/v1
kind: Deployment
metadata:
  name: cassandra1
  namespace: nslab-cassandra
  labels:
    app.kubernetes.io/name: cassandra1
    app.kubernetes.io/part-of: nslab
    nslab.io/stack: cassandra
    nslab.io/container: nslab-cassandra1
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cassandra1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cassandra1
        app.kubernetes.io/part-of: nslab
        nslab.io/stack: cassandra
        nslab.io/container: nslab-cassandra1
    spec:
      hostname: cassandra1
      containers:
      - name: cassandra1
        image: 10.10.2.51:8443/nslab/cassandra:5
        imagePullPolicy: IfNotPresent
        env:
        - name: CASSANDRA_CLUSTER_NAME
          value: lab
        - name: CASSANDRA_DC
          value: dc1
        - name: CASSANDRA_ENDPOINT_SNITCH
          value: GossipingPropertyFileSnitch
        - name: CASSANDRA_NUM_TOKENS
          value: '16'
        - name: CASSANDRA_RACK
          value: rack1
        - name: CASSANDRA_SEEDS
          value: cassandra1
        - name: HEAP_NEWSIZE
          value: 800M
        - name: JVM_EXTRA_OPTS
          value: -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false
        - name: JVM_OPTS
          value: -Dcassandra.skip_wait_for_gossip_to_settle=0 -Dcassandra.ring_delay_ms=5000
        - name: LOCAL_JMX
          value: 'no'
        - name: MAX_HEAP_SIZE
          value: 4G
        ports:
        - containerPort: 9042
        volumeMounts:
        - name: cass1
          mountPath: /var/lib/cassandra
        - name: backups
          mountPath: /backups
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - nodetool status | grep -q '^UN' && cqlsh -e 'describe keyspaces' >/dev/null
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
        startupProbe:
          exec:
            command:
            - sh
            - -c
            - nodetool status | grep -q '^UN' && cqlsh -e 'describe keyspaces' >/dev/null
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 63
      terminationGracePeriodSeconds: 30
      enableServiceLinks: false
      volumes:
      - name: cass1
        persistentVolumeClaim:
          claimName: cass1
      - name: backups
        persistentVolumeClaim:
          claimName: backups
