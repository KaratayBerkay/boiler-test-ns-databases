# generated by k8s/gen.py from stacks/elasticsearch/compose.yaml -- edit the compose file, then `make -C k8s gen`
apiVersion: apps/v1
kind: Deployment
metadata:
  name: es1
  namespace: nslab-elasticsearch
  labels:
    app.kubernetes.io/name: es1
    app.kubernetes.io/part-of: nslab
    nslab.io/stack: elasticsearch
    nslab.io/container: nslab-es1
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: es1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: es1
        app.kubernetes.io/part-of: nslab
        nslab.io/stack: elasticsearch
        nslab.io/container: nslab-es1
    spec:
      hostname: es1
      containers:
      - name: es1
        image: 10.10.2.51:8443/nslab/elasticsearch:9.5.3
        imagePullPolicy: IfNotPresent
        env:
        - name: ES_JAVA_OPTS
          value: -Xms3g -Xmx3g
        - name: bootstrap.memory_lock
          value: 'false'
        - name: cluster.initial_master_nodes
          value: es1,es2,es3
        - name: cluster.name
          value: nslab
        - name: cluster.routing.allocation.disk.threshold_enabled
          value: 'false'
        - name: discovery.seed_hosts
          value: es1,es2,es3
        - name: node.name
          value: es1
        - name: path.repo
          value: /backups
        - name: xpack.security.enabled
          value: 'false'
        - name: xpack.security.http.ssl.enabled
          value: 'false'
        ports:
        - containerPort: 9200
        volumeMounts:
        - name: es1
          mountPath: /usr/share/elasticsearch/data
        - name: backups
          mountPath: /backups
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - curl -fs http://localhost:9200/_cluster/health | grep -qE '"status":"(green|yellow)"'
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          exec:
            command:
            - sh
            - -c
            - curl -fs http://localhost:9200/_cluster/health | grep -qE '"status":"(green|yellow)"'
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 64
      terminationGracePeriodSeconds: 30
      enableServiceLinks: false
      volumes:
      - name: es1
        persistentVolumeClaim:
          claimName: es1
      - name: backups
        persistentVolumeClaim:
          claimName: backups
