# generated by k8s/gen.py from stacks/mongodb/compose.yaml -- edit the compose file, then `make -C k8s gen`
apiVersion: batch/v1
kind: Job
metadata:
  name: init
  namespace: nslab-mongodb
  labels:
    app.kubernetes.io/name: init
    app.kubernetes.io/part-of: nslab
    nslab.io/stack: mongodb
    nslab.io/container: nslab-mongo-init
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: init
        app.kubernetes.io/part-of: nslab
        nslab.io/stack: mongodb
        nslab.io/container: nslab-mongo-init
    spec:
      hostname: init
      containers:
      - name: init
        image: 10.10.2.51:8443/nslab/mongo:7
        imagePullPolicy: IfNotPresent
        args:
        - mongosh
        - --host
        - mongo1
        - --port
        - '27017'
        - --quiet
        - --file
        - /init/rs-init.js
        volumeMounts:
        - name: cm-init
          mountPath: /init
          readOnly: true
      terminationGracePeriodSeconds: 30
      enableServiceLinks: false
      initContainers:
      - name: wait-mongo1
        image: 10.10.2.51:8443/nslab/busybox:1.37
        command:
        - sh
        - -c
        - until nc -z -w 2 mongo1 27017; do echo waiting for mongo1:27017; sleep 2; done
      - name: wait-mongo2
        image: 10.10.2.51:8443/nslab/busybox:1.37
        command:
        - sh
        - -c
        - until nc -z -w 2 mongo2 27018; do echo waiting for mongo2:27018; sleep 2; done
      - name: wait-mongo3
        image: 10.10.2.51:8443/nslab/busybox:1.37
        command:
        - sh
        - -c
        - until nc -z -w 2 mongo3 27019; do echo waiting for mongo3:27019; sleep 2; done
      volumes:
      - name: cm-init
        configMap:
          name: cm-init
          defaultMode: 493
      restartPolicy: OnFailure
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo1
  namespace: nslab-mongodb
  labels:
    app.kubernetes.io/name: mongo1
    app.kubernetes.io/part-of: nslab
    nslab.io/stack: mongodb
    nslab.io/container: nslab-mongo1
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mongo1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongo1
        app.kubernetes.io/part-of: nslab
        nslab.io/stack: mongodb
        nslab.io/container: nslab-mongo1
    spec:
      hostname: mongo1
      containers:
      - name: mongo1
        image: 10.10.2.51:8443/nslab/mongo:7
        imagePullPolicy: IfNotPresent
        args:
        - mongod
        - --replSet
        - rs0
        - --bind_ip_all
        - --port
        - '27017'
        - --wiredTigerCacheSizeGB
        - '4'
        - --maxConns
        - '5000'
        - --profile
        - '1'
        - --slowms
        - '100'
        - --slowOpSampleRate
        - '1.0'
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: mongo1
          mountPath: /data/db
        - name: backups
          mountPath: /backups
        readinessProbe:
          exec:
            command:
            - mongosh
            - --quiet
            - --eval
            - db.adminCommand('ping').ok
          periodSeconds: 3
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          exec:
            command:
            - mongosh
            - --quiet
            - --eval
            - db.adminCommand('ping').ok
          periodSeconds: 3
          timeoutSeconds: 5
          failureThreshold: 30
      terminationGracePeriodSeconds: 30
      enableServiceLinks: false
      volumes:
      - name: mongo1
        persistentVolumeClaim:
          claimName: mongo1
      - name: backups
        persistentVolumeClaim:
          claimName: backups
