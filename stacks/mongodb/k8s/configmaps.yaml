# generated by k8s/gen.py from stacks/mongodb/compose.yaml -- edit the compose file, then `make -C k8s gen`
apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-init
  namespace: nslab-mongodb
  annotations:
    nslab.io/source: init
data:
  rs-init.js: "// Idempotent replica-set bootstrap. Members are advertised by the names/ports that resolve both inside the compose\n// network (mongoN) and, via /etc/hosts on the host, for a replicaSet-aware\
    \ client (see lab.yaml notes).\nconst cfg = {\n  _id: \"rs0\",\n  members: [\n    { _id: 0, host: \"mongo1:27017\", priority: 3 },\n    { _id: 1, host: \"mongo2:27018\", priority: 2 },\n    { _id: 2,\
    \ host: \"mongo3:27019\", priority: 1 },\n  ],\n};\ntry {\n  const st = rs.status();\n  if (st.ok) { print(\"replica set already initiated: \" + st.set); quit(0); }\n} catch (e) { /* not initiated */\
    \ }\nprintjson(rs.initiate(cfg));\n// wait for a primary\nfor (let i = 0; i < 60; i++) {\n  try { if (rs.isMaster().ismaster || db.hello().isWritablePrimary) { print(\"primary elected\"); quit(0); }\
    \ } catch (e) {}\n  sleep(1000);\n}\nprint(\"no primary after 60 s\"); quit(1);\n"
