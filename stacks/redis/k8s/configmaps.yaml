# generated by k8s/gen.py from stacks/redis/compose.yaml -- edit the compose file, then `make -C k8s gen`
apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-haproxy-haproxy-cfg
  namespace: nslab-redis
  annotations:
    nslab.io/source: haproxy/haproxy.cfg
data:
  haproxy.cfg: "global\n    maxconn 20000\ndefaults\n    mode tcp\n    timeout connect 5s\n    timeout client 120s\n    timeout server 120s\nlisten stats\n    bind *:8404\n    mode http\n    stats enable\n\
    \    stats uri /\nlisten redis_read\n    bind *:6381\n    balance roundrobin\n    option tcp-check\n    tcp-check send PING\\r\\n\n    tcp-check expect string +PONG\n    server primary primary:6379\
    \ check inter 2s\n    server replica replica:6379 check inter 2s\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-sentinel
  namespace: nslab-redis
  annotations:
    nslab.io/source: sentinel
data:
  sentinel.conf: 'port 26379

    sentinel resolve-hostnames yes

    sentinel announce-hostnames yes

    sentinel monitor mymaster primary 6379 2

    sentinel down-after-milliseconds mymaster 2000

    sentinel failover-timeout mymaster 10000

    sentinel parallel-syncs mymaster 1

    '
