# generated by k8s/gen.py from stacks/redis/compose.yaml -- edit the compose file, then `make -C k8s gen`
apiVersion: apps/v1
kind: Deployment
metadata:
  name: haproxy
  namespace: nslab-redis
  labels:
    app.kubernetes.io/name: haproxy
    app.kubernetes.io/part-of: nslab
    nslab.io/stack: redis
    nslab.io/container: nslab-redis-haproxy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: haproxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haproxy
        app.kubernetes.io/part-of: nslab
        nslab.io/stack: redis
        nslab.io/container: nslab-redis-haproxy
    spec:
      hostname: haproxy
      containers:
      - name: haproxy
        image: 10.10.2.51:8443/nslab/haproxy:lts
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 6381
        - containerPort: 8404
        volumeMounts:
        - name: cm-haproxy-haproxy-cfg
          mountPath: /usr/local/etc/haproxy/haproxy.cfg
          subPath: haproxy.cfg
          readOnly: true
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          exec:
            command:
            - sh
            - -c
            - haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 5
      terminationGracePeriodSeconds: 30
      enableServiceLinks: false
      initContainers:
      - name: wait-replica
        image: 10.10.2.51:8443/nslab/busybox:1.37
        command:
        - sh
        - -c
        - until nc -z -w 2 replica 6379; do echo waiting for replica:6379; sleep 2; done
      volumes:
      - name: cm-haproxy-haproxy-cfg
        configMap:
          name: cm-haproxy-haproxy-cfg
          defaultMode: 493
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: primary
  namespace: nslab-redis
  labels:
    app.kubernetes.io/name: primary
    app.kubernetes.io/part-of: nslab
    nslab.io/stack: redis
    nslab.io/container: nslab-redis-primary
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: primary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: primary
        app.kubernetes.io/part-of: nslab
        nslab.io/stack: redis
        nslab.io/container: nslab-redis-primary
    spec:
      hostname: primary
      containers:
      - name: primary
        image: 10.10.2.51:8443/nslab/redis:8
        imagePullPolicy: IfNotPresent
        args:
        - redis-server
        - --appendonly
        - 'yes'
        - --appendfsync
        - everysec
        - --save
        - ''
        - --maxclients
        - '10000'
        - --repl-diskless-sync
        - 'yes'
        - --repl-diskless-sync-delay
        - '0'
        - --protected-mode
        - 'no'
        - --io-threads
        - '4'
        - --slowlog-log-slower-than
        - '10000'
        - --slowlog-max-len
        - '1024'
        - --latency-monitor-threshold
        - '100'
        - --loglevel
        - notice
        ports:
        - containerPort: 6379
        volumeMounts:
        - name: redis-primary
          mountPath: /data
        - name: backups
          mountPath: /backups
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 3
        startupProbe:
          exec:
            command:
            - redis-cli
            - ping
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 30
      terminationGracePeriodSeconds: 30
      enableServiceLinks: false
      volumes:
      - name: redis-primary
        persistentVolumeClaim:
          claimName: redis-primary
      - name: backups
        persistentVolumeClaim:
          claimName: backups
