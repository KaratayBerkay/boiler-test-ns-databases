apiVersion: apps/v1
kind: Deployment
metadata:
  name: replica
  namespace: nslab-redis
  labels:
    app.kubernetes.io/name: replica
    app.kubernetes.io/part-of: nslab
    nslab.io/stack: redis
    nslab.io/container: nslab-redis-replica
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: replica
  template:
    metadata:
      labels:
        app.kubernetes.io/name: replica
        app.kubernetes.io/part-of: nslab
        nslab.io/stack: redis
        nslab.io/container: nslab-redis-replica
    spec:
      hostname: replica
      containers:
      - name: replica
        image: 10.10.2.51:8443/nslab/redis:8
        imagePullPolicy: IfNotPresent
        args:
        - redis-server
        - --replicaof
        - primary
        - '6379'
        - --appendonly
        - 'yes'
        - --appendfsync
        - everysec
        - --save
        - ''
        - --maxclients
        - '10000'
        - --replica-read-only
        - 'yes'
        - --protected-mode
        - 'no'
        - --io-threads
        - '4'
        - --slowlog-log-slower-than
        - '10000'
        - --slowlog-max-len
        - '1024'
        - --latency-monitor-threshold
        - '100'
        - --loglevel
        - notice
        ports:
        - containerPort: 6379
        volumeMounts:
        - name: redis-replica
          mountPath: /data
        - name: backups
          mountPath: /backups
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli info replication | grep -q 'master_link_status:up'
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 3
        startupProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli info replication | grep -q 'master_link_status:up'
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 40
      terminationGracePeriodSeconds: 30
      enableServiceLinks: false
      initContainers:
      - name: wait-primary
        image: 10.10.2.51:8443/nslab/busybox:1.37
        command:
        - sh
        - -c
        - until nc -z -w 2 primary 6379; do echo waiting for primary:6379; sleep 2; done
      volumes:
      - name: redis-replica
        persistentVolumeClaim:
          claimName: redis-replica
      - name: backups
        persistentVolumeClaim:
          claimName: backups
