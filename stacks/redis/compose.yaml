# Redis 8 (Open Source, Query Engine + JSON built in) — primary + async replica + 3 Sentinels (automatic failover)
# + HAProxy round-robin read endpoint over primary+replica (TCP-level, PING/+PONG health check).
name: nslab-redis
# Logging strategy (shared by every stack): the json-file driver with rotation so a chatty engine cannot fill the
# host disk, `compress` for rotated files. `docker logs <container>` still works; a shipper (promtail/fluent-bit/otel
# collector) tails the same files. Engine-side slow-query / audit settings live in the service `command`/`environment`.
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"
    compress: "true"
services:
  primary:
    image: redis:8
    container_name: nslab-redis-primary
    # slowlog/latency-monitor thresholds are the logging strategy (SLOWLOG GET / LATENCY LATEST are read by the harness);
    # `--save ""` disables automatic RDB snapshots — backups are explicit BGSAVE + copy of dump.rdb (see the backup phase).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "", "--maxclients", "10000",
              "--repl-diskless-sync", "yes", "--repl-diskless-sync-delay", "0", "--protected-mode", "no", "--io-threads", "4",
              "--slowlog-log-slower-than", "10000", "--slowlog-max-len", "1024", "--latency-monitor-threshold", "100", "--loglevel", "notice"]
    logging: *logging
    ports:
      - "16379:6379"
    volumes:
      - redis-primary:/data
      - backups:/backups
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  replica:
    image: redis:8
    container_name: nslab-redis-replica
    command: ["redis-server", "--replicaof", "primary", "6379", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "",
              "--maxclients", "10000", "--replica-read-only", "yes", "--protected-mode", "no", "--io-threads", "4",
              "--slowlog-log-slower-than", "10000", "--slowlog-max-len", "1024", "--latency-monitor-threshold", "100", "--loglevel", "notice"]
    logging: *logging
    ports:
      - "16380:6379"
    volumes:
      - redis-replica:/data
      - backups:/backups
    depends_on:
      primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli info replication | grep -q 'master_link_status:up'"]
      interval: 2s
      timeout: 2s
      retries: 40

  sentinel1: &sentinel
    image: redis:8
    container_name: nslab-redis-sentinel1
    command: ["sh", "-c", "cp /conf/sentinel.conf /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"]
    logging: *logging
    volumes:
      - ./sentinel:/conf:ro
    ports:
      - "26379:26379"
    depends_on:
      replica:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 26379 sentinel master mymaster | grep -q mymaster"]
      interval: 2s
      timeout: 2s
      retries: 30
  sentinel2:
    <<: *sentinel
    container_name: nslab-redis-sentinel2
    ports:
      - "26380:26379"
  sentinel3:
    <<: *sentinel
    container_name: nslab-redis-sentinel3
    ports:
      - "26381:26379"

  haproxy:
    image: haproxy:lts
    container_name: nslab-redis-haproxy
    logging: *logging
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "16381:6381"   # read endpoint -> round-robin primary+replica
      - "18405:8404"   # stats
    depends_on:
      replica:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-primary:
  redis-replica:
  backups:          # backup artifacts (RDB copies) — shared by primary and replica, removed with `down -v`
