[project]
name = "nslab"
version = "0.1.0"
description = "NoSQL database lab: capability, optimisation, connection and replication tests across document, key-value, wide-column, graph, search, time-series and vector engines running in Docker Compose"
requires-python = ">=3.12"
dependencies = [
  "pymongo>=4.10",
  "redis>=5.2",
  "hiredis>=3.0",
  "cassandra-driver>=3.29",
  "neo4j>=5.27",
  "httpx>=0.27",
  "pymemcache>=4.0",
  "python-arango>=8.1",
  "lmdb>=1.5",
  "rocksdict>=0.3",
  "tarantool>=1.2",
  "falkordb>=1.0",
  "pyyaml>=6",
  "rich>=13",
  "tabulate>=0.9",
  "typer>=0.12",
]

[project.optional-dependencies]
exotic = [
  "couchbase>=4.3",
  "aerospike>=15.0",
  "pymilvus>=2.5",
  "weaviate-client>=4.10",
  "qdrant-client>=1.12",
  "surrealdb>=1.0",
  "pydgraph>=24.0",
  "chromadb-client>=1.0",
  "etcd3>=0.12",
]

[project.scripts]
nslab = "nslab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nslab"]
